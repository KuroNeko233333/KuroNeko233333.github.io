<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>资料库总览 - 5e全书</title>
<link rel="ours-stylesheet" data-ours-src="/__ours/ours.css">
<style>
	body { margin: 0; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f3ede2; color: #2a2233; }
	.wrap { max-width: 1240px; margin: 0 auto; padding: 18px; }
	.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
	.top a { color: #7d4466; }
	h1 { margin: 0; font-size: 28px; letter-spacing: 3px; }
	.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 16px 0; }
	.card { background: #fffaf0; border: 1px solid rgba(80, 50, 30, .18); border-radius: 12px; padding: 10px 12px; box-shadow: 0 2px 8px rgba(0, 0, 0, .06); }
	.card b { display: block; font-size: 22px; color: #7d4466; }
	.card span { font-size: 12px; opacity: .7; }
	.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0 10px; }
	.tools input { flex: 1 1 260px; padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(80, 50, 30, .25); font: inherit; }
	.chip { border: 1px solid rgba(80, 50, 30, .25); background: #fffaf0; border-radius: 999px; padding: 5px 12px; cursor: pointer; font: inherit; font-size: 13px; }
	.chip.on { background: linear-gradient(135deg, #f6d27a, #d9a441); border-color: #b8862e; font-weight: 700; }
	table { width: 100%; border-collapse: separate; border-spacing: 0; background: #fffaf0; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 10px rgba(0, 0, 0, .08); font-size: 13px; }
	th { position: sticky; top: 0; background: #2b1836; color: #f6dfa4; text-align: left; padding: 8px; cursor: pointer; white-space: nowrap; }
	td { padding: 6px 8px; border-top: 1px solid rgba(80, 50, 30, .1); vertical-align: top; }
	tr:hover td { background: rgba(217, 164, 65, .1); }
	td.n { text-align: right; font-variant-numeric: tabular-nums; color: #555; }
	td.n.z { color: #ccc; }
	.tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: #eee; margin-right: 4px; }
	.tag.ours { background: #f6d27a; }
	.tag.one { background: #cde3ff; }
	.muted { opacity: .6; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
	<div class="top"><h1>📚 资料库总览</h1><a href="/index.html">← 回到大厅</a><span class="muted">网站自带官方资料 + 中文第三方库 + 我们的扩充，全部在本机</span></div>
	<div class="cards" id="cards"></div>
	<div class="tools">
		<input id="q" placeholder="搜书名、作者、来源缩写……">
		<button class="chip on" data-f="all">全部</button>
		<button class="chip" data-f="ours">我们的扩充</button>
		<button class="chip" data-f="lib">中文第三方库</button>
		<button class="chip" data-f="player">有玩家选项</button>
		<button class="chip" data-f="one">2024 版</button>
	</div>
	<table><thead><tr>
		<th data-k="name">书名</th><th data-k="abv">缩写</th><th data-k="author">作者 / 译者</th>
		<th data-k="race">种族</th><th data-k="class">职业</th><th data-k="subclass">子职</th><th data-k="spell">法术</th><th data-k="feat">专长</th>
		<th data-k="background">背景</th><th data-k="optionalfeature">选项</th><th data-k="item">物品</th><th data-k="monster">怪物</th>
	</tr></thead><tbody id="tb"></tbody></table>
</div>
<script>
(async () => {
	const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;"}[c]));
	const [books, stats] = await Promise.all([fetch("/__api/books").then(r => r.json()), fetch("/__api/stats").then(r => r.json())]);
	const K = ["race", "class", "subclass", "spell", "feat", "background", "optionalfeature", "item", "monster"];
	const NAME = {race: "种族", class: "职业", subclass: "子职", spell: "法术", feat: "专长", background: "背景", optionalfeature: "职业选项", item: "物品", monster: "怪物"};
	const cnt = (f, k) => {
		const c = f.counts || {};
		if (k === "race") return (c.race || 0) + (c.subrace || 0);
		if (k === "item") return (c.item || 0) + (c.baseitem || 0) + (c.magicvariant || 0);
		return c[k] || 0;
	};
	document.getElementById("cards").innerHTML = K.map(k => `<div class="card"><span>${NAME[k]}</span><b>${(stats.official[k] || 0) + (k === "race" ? stats.official.subrace : 0)}</b><span>官方 · 第三方 ${stats.brew[k] || 0}${stats.ours[k] ? ` · 我们的 ${stats.ours[k]}` : ""}</span></div>`).join("");
	const rows = books.map(f => {
		const s = f.sources[0] || {};
		return {f, name: (f.sources.map(x => x.full).filter(Boolean).join(" / ")) || f.id, abv: f.sources.map(x => x.abbreviation).join(" "),
			author: [...new Set([...(s.authors || []), s.translator].filter(Boolean))].join("、"),
			...Object.fromEntries(K.map(k => [k, cnt(f, k)]))};
	});
	let filter = "all", sortK = "name", sortDir = 1;
	const render = () => {
		const q = document.getElementById("q").value.trim().toLowerCase();
		const list = rows.filter(r => {
			if (filter === "ours" && !r.f.ours) return false;
			if (filter === "lib" && r.f.ours) return false;
			if (filter === "player" && !(r.race + r.class + r.subclass + r.spell + r.feat + r.background)) return false;
			if (filter === "one" && r.f.edition !== "one") return false;
			return !q || `${r.name} ${r.abv} ${r.author} ${r.f.file}`.toLowerCase().includes(q);
		}).sort((a, b) => (typeof a[sortK] === "number" ? (a[sortK] - b[sortK]) : String(a[sortK]).localeCompare(String(b[sortK]), "zh")) * sortDir);
		document.getElementById("tb").innerHTML = list.map(r => `<tr><td>${r.f.ours ? `<span class="tag ours">我们的</span>` : ""}${r.f.edition === "one" ? `<span class="tag one">2024</span>` : ""}${esc(r.name)}<div class="muted">${esc(r.f.file)}</div></td>
			<td>${esc(r.abv)}</td><td>${esc(r.author)}</td>${K.map(k => `<td class="n ${r[k] ? "" : "z"}">${r[k] || "·"}</td>`).join("")}</tr>`).join("");
	};
	document.getElementById("q").addEventListener("input", render);
	document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
		document.querySelectorAll(".chip").forEach(x => x.classList.remove("on")); c.classList.add("on"); filter = c.dataset.f; render();
	}));
	document.querySelectorAll("th").forEach(th => th.addEventListener("click", () => {
		const k = th.dataset.k; if (sortK === k) sortDir = -sortDir; else { sortK = k; sortDir = typeof rows[0]?.[k] === "number" ? -1 : 1; } render();
	}));
	render();
})();
</script>
</body>
</html>
