	// V4 是一层层叠出来的：nt（V1 的基础样式）+ nt2（V2 的页面结构）+ nt3（V3 的顶部导航和暖色）+ nt4（V4 的职业页重排），四个类都要加。
	document.documentElement.classList.add("nt", "nt2", "nt3", "nt4");
	// Before any stylesheet or frame is painted; the site's switcher reads the same theme.
	try {
		const theme = localStorage.getItem("ours.theme") === "night" ? "night" : "day";
		document.documentElement.dataset.oursTheme = theme;
		document.documentElement.classList.toggle("ve-night-mode", theme === "night");
		localStorage.setItem("StyleSwitcher_style", theme);
	} catch (e) { document.documentElement.dataset.oursTheme = "day"; }
</script>
<script>
	// 2026-11-20 起日常入口是新网站（/newsite/）。新网站已重做的页面一律去新网站（旧书签照样能打开）；
	// 这个旧外壳只留给还没重做的几页（战利品、人生、地图、管理自制内容、黑名单……）。名单和新网站 option-view.js 的 ownedPage 一致。
	// 只在本地服务发出外壳时注入：制包程序直接读 shell.html，仍在旧外壳里排版旧页面。
	(function () {
		const OWNED = new Set(["index", "races", "classes", "spells", "feats", "backgrounds", "optionalfeatures", "items", "bestiary", "books", "book", "adventures", "adventure", "library", "variantrules", "conditionsdiseases", "actions", "tables", "languages", "deities", "quickreference", "charcreationoptions", "statgen", "names", "dmscreen", "crcalculator", "trapshazards", "objects", "cultsboons", "rewards", "vehicles", "bastions", "decks", "psionics", "recipes", "homecrafts", "terms", "search"]);
		window.__oursOwned = page => OWNED.has(String(page).replace(/\.html$/, ""));
		window.__oursToNew = (page, rest, query, step) => {
			if (!window.__oursOwned(page)) return false;
			window.__oursLeaving = true;
			const q = query ? (query[0] === "?" ? query : "?" + query) : "";
			location[step ? "assign" : "replace"]("/newsite/" + (page === "index.html" ? "" : page) + q + (rest || ""));
			return true;
		};
		const m = location.hash.match(/^#\/?([^#?]+?\.html)(#.*)?$/);
		if (!m) { window.__oursLeaving = true; location.replace("/newsite/" + location.search); }
		else window.__oursToNew(m[1], m[2] || "", location.search, false);
	})();

		books: '<path d="M3.8 4.6h4.4A1.8 1.8 0 0 1 10 6.4v9.8a1.6 1.6 0 0 0-1.6-1.6H3.8zM16.2 4.6h-4.4A1.8 1.8 0 0 0 10 6.4v9.8a1.6 1.6 0 0 1 1.6-1.6h4.6z"/>',
		doc: '<path d="M5.5 3.5h6.2l3 3v9.7a.6.6 0 0 1-.6.6H5.5a.6.6 0 0 1-.6-.6V4.1a.6.6 0 0 1 .6-.6z"/><path d="M11.5 3.6V6.8h3.1"/>',

		data: '<ellipse cx="10" cy="5.6" rx="5.4" ry="2"/><path d="M4.6 5.6v8.8c0 1.1 2.4 2 5.4 2s5.4-.9 5.4-2V5.6M4.6 10c0 1.1 2.4 2 5.4 2s5.4-.9 5.4-2"/>',
		layout: '<rect x="3.5" y="4.5" width="13" height="11" rx="1.2"/><path d="M8 4.5v11"/>',
		more: '<circle cx="5" cy="10" r="1.1" fill="currentColor"/><circle cx="10" cy="10" r="1.1" fill="currentColor"/><circle cx="15" cy="10" r="1.1" fill="currentColor"/>',
		collapse: '<path d="m9.5 5.5-4.5 4.5 4.5 4.5M15 5.5 10.5 10l4.5 4.5"/>',
		expand: '<path d="m5 5.5 4.5 4.5L5 14.5M10.5 5.5 15 10l-4.5 4.5"/>',
	};
	const icon = k => SVG(ICONS[k] || ICONS.doc);
	const PAGE_IC = {"index.html": "home", "races.html": "races", "classes.html": "classes", "spells.html": "spells", "feats.html": "feats", "backgrounds.html": "backgrounds",
		"optionalfeatures.html": "optionalfeatures", "items.html": "items", "bestiary.html": "bestiary", "books.html": "books", "book.html": "books"};
	document.querySelectorAll("[data-ic]").forEach(e => { e.innerHTML = icon(e.dataset.ic); });
	// Main pages stay alive in their own frame: after the first visit, switching between them is instant.
	const MAIN = [
		["index.html", "大厅"], ["races.html", "种族"], ["classes.html", "职业"], ["spells.html", "法术"], ["feats.html", "专长"],
		["backgrounds.html", "背景"], ["optionalfeatures.html", "职业选项"], ["items.html", "物品"], ["bestiary.html", "怪物"], ["books.html", "书库"],

	const HEAVY = ["items.html", "bestiary.html"];
	const MEM_MODES = {
		save: {label: "省内存", tip: "只保留当前页、大厅和最近看过的 2 页；不预载"},
		balanced: {label: "均衡", tip: "常用页面（种族、职业、法术、专长、背景、职业选项）常驻并预载；物品/怪物用到才载入，离开 5 分钟后自动释放"},
		max: {label: "全速", tip: "所有页面全部预载并常驻，切换全部瞬间完成；内存占用最多"},
	};
	const memMode = () => { try { return MEM_MODES[localStorage.getItem("ours.memMode")] ? localStorage.getItem("ours.memMode") : "balanced"; } catch (e) { return "balanced"; } };
	const preloadList = () => (memMode() === "save" ? [] : memMode() === "max" ? [...LIGHT, ...HEAVY] : LIGHT).filter(p => !window.__oursOwned?.(p));   // 已重做的页面在新网站，不在这里预载
	const lastShown = {};
	const MODES = [
		["rec", "推荐", "官方＋甲、乙两档第三方（不全书收录范围与知名出版社）＋我们的扩充。默认"],
		["official", "常规", "只显示威世智（WotC）官方资料"],
		["all", "全部", "推荐范围之外，再加上其余所有第三方（丙档：个人自制、小众作品等）"],
		["brew", "只看第三方", "只显示甲、乙两档第三方和我们的扩充"],
		["manual", "手动", "不干预，用页面自己的来源筛选"],
	];
	const LS_MODE = "ours.srcMode2";
	window.__oursShell = true;
	let searchClient;
	window.__oursSearchRequest = (...args) => {
		searchClient ||= import("/__ours/search-worker.js").then(module => module.createSearchClient())
			.catch(error => { searchClient = null; throw error; });
		return searchClient.then(request => request(...args));
	};

	const tabsEl = document.getElementById("tabs");
	const framesEl = document.getElementById("frames");
	const frames = {};      // page -> {frame, tab, ready}
	let active = null;

	const pageOf = path => {
		const parts = path.split("/").filter(Boolean);
		let p = parts.pop() || "index.html";
		if (p === "index.html" && parts.length) p = parts.pop() + ".html";
		if (!p.includes(".")) p += ".html";
		return p;
	};
	const titleOf = page => (MAIN.find(m => m[0] === page) || [])[1];

	function makeTab (page, label, closable) {
		const t = document.createElement("button");
		t.className = "tab" + (closable ? " extra" : "");
		t.innerHTML = `<span class="ic nt-only">${icon(PAGE_IC[page])}</span><span class="dot"></span><span class="lbl"></span>${closable ? `<span class="x" title="关闭">×</span>` : ""}`;
		t.querySelector(".lbl").textContent = label;
		t.addEventListener("click", e => {
			if (e.target.classList.contains("x")) { e.stopPropagation(); closePage(page); return; }
			go(page);
		});
		tabsEl.appendChild(t);
		return t;
	}
	MAIN.forEach(([page, label]) => { frames[page] = {tab: makeTab(page, label, false)}; });

	const frameUrl = (page, hash, query = "") => "/" + (window.__OURS_WEB && page === "index.html" ? "home.html" : page) + query + (hash || "");

	function ensureFrame (page, hash, query = "") {
		let f = frames[page];
		const existed = !!f?.frame;
		if (!f) {
			f = frames[page] = {tab: makeTab(page, "…", true)};
		}
		if (!f.frame) {
			const fr = document.createElement("iframe");
			fr.src = frameUrl(page, hash, query);
			if (NT) { fr.classList.add("nt-wait"); setTimeout(() => fr.classList.remove("nt-wait"), 6000); }
			fr.addEventListener("load", () => {
				setTimeout(() => fr.classList.remove("nt-wait"), 800);
				const title = (fr.contentDocument?.title || "").split(" - ")[0];
				if (!titleOf(page) && title) f.tab.querySelector(".lbl").textContent = title;
				if (active === page) syncTitle();
				setTimeout(() => markReady(page), 4000);   // pages without a list never send "ready"
			});
			framesEl.appendChild(fr);
			f.frame = fr;
			f.mode = lsGet();
			f.ed = edGet();
			f.query = query;
			f.pinHash = hash;
			f.ready = false;
			f.tab.classList.remove("sleep", "ready");
			f.tab.classList.add("loading");
		}
		f.existed = existed;
		return f;
	}

	function markReady (page) {
		const f = frames[page];
		if (!f || f.ready) return;
		f.ready = true;
		autoUntil[page] = Date.now() + 2500;   // the page's own first moves after loading (picking the first row, applying a link's filters)
		f.tab.classList.remove("loading");
		f.tab.classList.add("ready");
		if (page === active) paintCrumbs();
		schedulePreload();
	}

	// ---- back / forward: one history entry per step you take (open a page, follow a link, pick an entry);
	// the pages themselves only replace their entry (ours.js), so back always returns to the previous step
	const autoUntil = {};   // page -> until when its #hash changes are its own follow-up, not a step of yours
	const stepNext = {};    // page -> its next #hash change comes from a click of yours
	function go (page, hash, query) {
		if (window.__oursToNew?.(page, hash, query, true)) return;   // 日常入口：已重做的页面去新网站（app.py 注入）
		query ??= !hash ? frames[page]?.query || "" : "";
		const want = "#" + page + (hash || "");
		if (decodeURIComponent(location.hash) !== decodeURIComponent(want) || query !== (history.state?.query || "")) {

	}
	window.addEventListener("popstate", () => {
		const m = decodeURIComponent(location.hash.slice(1)).match(/^([^#]+?\.html)(#.*)?$/);

	function show (page, hash, query) {
		if (window.__oursToNew?.(page, hash, query, false)) return;

		const reload = f.existed && (query !== f.query || page === "classes.html" && hash
			&& /(?:\?|&)ours-(?:search|source)=/.test(query) && hash !== f.pinHash);
		if (reload) {
			f.query = query;
			f.pinHash = hash;
			f.ready = false;
			f.tab.classList.remove("ready");
			f.tab.classList.add("loading");
			f.frame.src = frameUrl(page, hash, query);
		} else if (hash && f.existed) {
			try {
				const w = f.frame.contentWindow;

				// replacing it would cancel the real page and leave an empty /blank frame. Retarget the load instead.
				if (w.location.href === "about:blank") {
					const url = frameUrl(page, hash, query);
					if (f.frame.getAttribute("src") !== url) f.frame.src = url;

			} catch (e) { /* not loaded yet */ }
		}

			x.tab.classList.toggle("on", p === page);
			x.frame?.classList.toggle("on", p === page);
		});
		active = page;
		lastShown[page] = Date.now();
		enforce();
		f.tab.scrollIntoView({block: "nearest", inline: "nearest"});
		if (!reload) syncTitle();
		try { f.frame.contentWindow.focus(); } catch (e) { /* ignore */ }
		// pages hidden while the switch changed catch up only now, so a click never makes every page work at once
		if (f.existed && f.mode !== lsGet()) tellMode(f);
		if (f.existed && f.ed !== edGet()) tellEd(f);
	}

	function closePage (page) {
		const f = frames[page];
		if (!f || titleOf(page)) return;
		f.frame?.remove();
		f.tab.remove();
		delete frames[page];
		if (active === page) show("index.html");
	}

	function syncTitle (step) {
		const f = frames[active];
		let hash = "";
		try { hash = f.frame.contentWindow.location.hash; document.title = f.frame.contentDocument.title || "5e全书"; } catch (e) { /* loading */ }
		const want = "#" + active + hash;
		if (decodeURIComponent(location.hash) !== decodeURIComponent(want)) {
			// a new entry only for a step of yours inside the page; the entry of a page opened without a #hash is just filled in
			const pinned = new URLSearchParams(f.query).get("ours-search");
			const entry = hash.slice(1).split(",", 1)[0].toLowerCase();
			const state = f.query && (!pinned || pinned === entry) ? {query: f.query} : null;

	const crumbsEl = document.getElementById("crumbs");
	const pgState = document.getElementById("pgstate");
	const escH = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;"}[c]));
	function paintCrumbs () {

		const doc = (() => { try { return f.frame.contentDocument; } catch (e) { return null; } })();

		if (row) {

	crumbsEl.addEventListener("click", e => {
		if (!e.target.closest(".crumb")) return;
		try { frames[active].frame.contentWindow.scrollTo({top: 0, behavior: "smooth"}); } catch (err) { /* ignore */ }
	});
	setInterval(() => { if (NT && document.visibilityState === "visible") paintCrumbs(); }, 1500);

	// ---- search (Ctrl+K): the page on screen opens its own global search as a Notion search window
	function openSearch () {
		const f = frames[active];
		try { f.frame.contentWindow.focus(); f.frame.contentWindow.postMessage({type: "ours-search"}, location.origin); } catch (e) { /* loading */ }
	}
	["sbsearch", "tbsearch"].forEach(id => document.getElementById(id).addEventListener("click", openSearch));
	// ---- sidebar: hide / show (Ctrl+\)
	const setSb = hidden => {
		if (NT3) return;   // no sidebar in V3
		document.documentElement.classList.toggle("nt-sb-hidden", hidden);
		try { localStorage.setItem("ours.sbHidden", hidden ? "1" : "0"); } catch (e) { /* ignore */ }
	};
	document.getElementById("sbhide").addEventListener("click", e => { e.stopPropagation(); setSb(true); });
	document.getElementById("sbshow").addEventListener("click", () => setSb(false));
	document.addEventListener("keydown", e => {
		if (!NT || !(e.ctrlKey || e.metaKey) || e.altKey) return;
		if (e.key === "k" || e.key === "K") { e.preventDefault(); openSearch(); }
		if (e.key === "\\") { e.preventDefault(); setSb(!document.documentElement.classList.contains("nt-sb-hidden")); }
	});
	// ---- 内存 / 本地资料 live in one small menu at the right end of the top bar
	if (NT3) {
		const moreBtn = document.getElementById("more"), menu = document.getElementById("moremenu"), st = document.getElementById("status");
		menu.append(document.getElementById("mem"), st);
		const openMenu = on => { menu.classList.toggle("on", on); moreBtn.classList.toggle("open", on); };
		moreBtn.addEventListener("click", e => { e.stopPropagation(); openMenu(!menu.classList.contains("on")); });
		st.addEventListener("click", () => openMenu(false));
		document.addEventListener("click", e => { if (!e.target.closest("#moremenu")) openMenu(false); });
		window.addEventListener("blur", () => openMenu(false));   // a click inside a page
		document.addEventListener("keydown", e => { if (e.key === "Escape") openMenu(false); });
		// something to report (exporting, updating, a notice) shows as a dot on the button
		const note = () => moreBtn.classList.toggle("note", st.classList.contains("busy") || st.classList.contains("off") || /有提示/.test(st.textContent));
		new MutationObserver(note).observe(st, {attributes: true, attributeFilter: ["class"], childList: true, subtree: true, characterData: true});
		note();
	}

	// ---- memory: let rarely used pages go to sleep (they reload when clicked again)
	function unload (page) {
		const f = frames[page];
		if (!f?.frame || page === active) return;
		f.frame.remove();
		f.frame = null;
		f.ready = false;
		f.tab.classList.remove("loading", "ready");
		f.tab.classList.add("sleep");
		f.tab.title = "已释放内存，点击重新载入";
	}
	function enforce () {
		const mode = memMode();
		if (mode === "max") return;
		const now = Date.now();
		const loaded = Object.keys(frames).filter(p => frames[p].frame && p !== active && p !== "index.html");
		const byRecent = loaded.sort((a, b) => (lastShown[b] || 0) - (lastShown[a] || 0));
		if (mode === "save") {
			byRecent.slice(2).forEach(unload);
			return;
		}
		// balanced: one heavy page at most, released 5 minutes after you leave it; extra pages: the 3 most recent
		const heavy = byRecent.filter(p => HEAVY.includes(p));
		heavy.forEach((p, i) => { if (i > 0 || HEAVY.includes(active) || now - (lastShown[p] || 0) > 5 * 60 * 1000) unload(p); });
		const extra = byRecent.filter(p => !LIGHT.includes(p) && !HEAVY.includes(p) && !MAIN.some(m => m[0] === p));
		extra.slice(3).forEach(unload);
	}
	setInterval(enforce, 30000);

	const memBtn = document.getElementById("mem");
	const paintMem = () => {
		const m = MEM_MODES[memMode()];
		memBtn.innerHTML = `<span class="ic nt-only">${icon("mem")}</span><span>内存<span class="classic-only">：</span></span><span class="v">${m.label}</span>`;
		memBtn.title = m.tip + "\n（点击切换：均衡 → 全速 → 省内存）";
	};
	memBtn.addEventListener("click", () => {
		const order = ["balanced", "max", "save"];
		const next = order[(order.indexOf(memMode()) + 1) % order.length];
		try { localStorage.setItem("ours.memMode", next); } catch (e) { /* ignore */ }
		paintMem();
		enforce();
		schedulePreload();
	});
	paintMem();

	// ---- preload the main pages one by one while the user reads
	let preloading = false;
	function schedulePreload () {
		if (preloading) return;
		const next = preloadList().find(p => !frames[p]?.frame && !frames[p]?.tab.classList.contains("sleep"));
		const busy = Object.values(frames).some(f => f.frame && !f.ready);
		if (!next || busy) return;
		preloading = true;
		const go = () => { preloading = false; ensureFrame(next); };
		(window.requestIdleCallback || setTimeout)(go, {timeout: 1500});
	}

	// ---- messages from the pages
	window.addEventListener("message", e => {
		if (e.origin !== location.origin) return;
		const d = e.data || {};
		const page = Object.keys(frames).find(p => frames[p].frame?.contentWindow === e.source);
		if (d.type === "ours-ready" && page) markReady(page);
		if (d.type === "ours-styled" && page) frames[page].frame?.classList.remove("nt-wait");
		if (d.type === "ours-sidebar") setSb(!document.documentElement.classList.contains("nt-sb-hidden"));
		if (d.type === "ours-step" && page) stepNext[page] = true;
		if (d.type === "ours-hash" && page === active) {
			syncTitle(stepNext[page] || (frames[page].ready && Date.now() > (autoUntil[page] || 0)));
			stepNext[page] = false;
		}
		if (d.type === "ours-nav") {
			const target = pageOf(d.path || "/");
			go(target, d.hash || "", d.query || "");
		}
	});

	// ---- source switch (shared by every page through localStorage)
	const sw = document.getElementById("switch");
	const lsGet = () => { let m; try { m = localStorage.getItem(LS_MODE); } catch (e) { /* ignore */ } return MODES.some(x => x[0] === m) ? m : "rec"; };
	const LS_ED = "ours.edMode2";   // 2026-11-13: default 5.5e (new key, so everyone starts on 5.5e once); "" = 两版
	const edGet = () => { let m = null; try { m = localStorage.getItem(LS_ED); } catch (e) { /* ignore */ } return m === null ? "24" : ["14", "24"].includes(m) ? m : ""; };
	function tellEd (f) {
		f.ed = edGet();
		try { f.frame?.contentWindow.postMessage({type: "ours-ed"}, location.origin); } catch (e) { /* ignore */ }
	}
	function tellMode (f) {
		f.mode = lsGet();
		try { f.frame?.contentWindow.postMessage({type: "ours-mode"}, location.origin); } catch (e) { /* ignore */ }
	}
	document.cookie = `ours_src=${lsGet()}; path=/; max-age=31536000; SameSite=Lax`;
	sw.innerHTML = MODES.map(([id, label, tip]) => `<button class="seg" data-mode="${id}" title="${tip}">${label}</button>`).join("");
	const paint = () => sw.querySelectorAll(".seg").forEach(b => b.classList.toggle("on", b.dataset.mode === lsGet()));
	sw.querySelectorAll(".seg").forEach(b => b.addEventListener("click", () => {
		try { localStorage.setItem(LS_MODE, b.dataset.mode); } catch (e) { /* ignore */ }
		document.cookie = `ours_src=${b.dataset.mode}; path=/; max-age=31536000; SameSite=Lax`;
		paint();
		if (active && frames[active]?.frame) tellMode(frames[active]);
	}));
	window.addEventListener("storage", e => { if (e.key === LS_MODE) paint(); });
	paint();

	// ---- edition switch: 两版 / 5e (2014) / 5.5e (2024) — same "only the visible page works now" rule
	const ED_MODES = [
		["24", "5.5e", "5.5e（2024）：有 2024 版的只显示 2024 版；只有 2014 版的照常显示"],
		["14", "5e", "5e（2014）：有 2014 版的只显示 2014 版；只有 2024 版的照常显示"],
		["", "两版", "2014 和 2024 版都显示"],
	];
	const edsw = document.getElementById("edsw");
	edsw.innerHTML = ED_MODES.map(([id, label, tip]) => `<button class="eds" data-ed="${id}" title="${tip}">${label}</button>`).join("");
	const paintEd = () => edsw.querySelectorAll(".eds").forEach(b => b.classList.toggle("on", b.dataset.ed === edGet()));
	edsw.querySelectorAll(".eds").forEach(b => b.addEventListener("click", () => {
		try { localStorage.setItem(LS_ED, b.dataset.ed); } catch (e) { /* ignore */ }
		paintEd();
		if (active && frames[active]?.frame) tellEd(frames[active]);
	}));
	paintEd();

	// ---- data status + menu: export the complete data pack / manual update (never automatic)
	const st = document.getElementById("status");
	const menu = document.getElementById("datamenu");
	const esc = t => String(t ?? "").replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
	const post = u => fetch(u, {method: "POST", headers: {"X-Local-Reader": "1"}, body: "{}"}).then(r => r.json());
	let S = {};
	async function poll () {
		if (window.__OURS_WEB) return S;
		try {
			const s = S = await (await fetch("/__api/status", {cache: "no-store"})).json();
			const busy = /正在/.test(s.phase || "");
			st.className = busy ? "busy" : s.error ? "off" : "ok";
			st.querySelector(".lbl").textContent = busy ? s.phase : s.error ? "本地资料 · 有提示" : "本地资料";
			st.title = `${s.phase || ""}${s.error ? "\n" + s.error : ""}\n第三方库 + 我们的扩充：${s.brew_books || 0} 本\n点击：导出数据包 / 联网检查更新`;
			menu.querySelector(".info").innerHTML = `<div>第三方库 + 我们的扩充：${s.brew_books || 0} 本</div>` +
				`<div>${esc(s.phase || "")}</div>` + (s.last_export ? `<div class="path">上次导出：${esc(s.last_export)}</div>` : "");
		} catch (e) { /* restarting */ }
		return S;
	}
	if (window.__OURS_WEB) [st, menu, document.getElementById("mem")].forEach(el => { el.style.setProperty("display", "none", "important"); });
	st.addEventListener("click", ev => { if (window.__OURS_WEB) return; ev.stopPropagation(); poll(); menu.classList.toggle("on"); });
	document.addEventListener("click", ev => { if (!menu.contains(ev.target)) menu.classList.remove("on"); });
	window.addEventListener("blur", () => menu.classList.remove("on"));
	menu.querySelector('[data-act="export"]').addEventListener("click", async () => {
		menu.classList.remove("on");
		const r = await post("/__api/export-pack");
		st.className = "busy"; st.querySelector(".lbl").textContent = "正在导出数据包……";
		for (let i = 0; i < 600; i++) {
			await new Promise(res => setTimeout(res, 1500));
			const s = await poll();
			if (/^已导出数据包/.test(s.phase || "")) { alert(/完整版/.test(s.last_export || "")
				? `完整版已导出（程序 + 全部资料）：\n${s.last_export}\n\n把这一个文件发给朋友，解压后双击里面的程序即可。`
				: `数据包已导出：\n${s.last_export}\n\n已经有程序的朋友：把它放在程序旁边，再打开程序即可。\n想导出连程序一起的「完整版」：把 KuroNeko-5etools.exe 放进这个文件夹，再导出一次。`); return; }
			if (/导出数据包失败/.test(s.phase || "")) { alert(`导出失败：${s.error || ""}`); return; }
		}
	});
	menu.querySelector('[data-act="update"]').addEventListener("click", async () => {
		menu.classList.remove("on");
		if (!confirm("将联网从原作者的仓库下载新资料。\n更新前会自动把现有资料备份成数据包，我们自己的扩充不会被改动。\n继续吗？")) return;
		await post("/__api/update");
		setTimeout(poll, 1500);
	});
	poll();
	setInterval(poll, 30000);

	document.getElementById("brand").addEventListener("click", () => go("index.html"));

	// ---- start: restore what was open, else the hall
	const start = decodeURIComponent(location.hash.slice(1));
	const m = start.match(/^([^#]+?\.html)(#.*)?$/);
	if (m) {
		if (m[1] !== "index.html" && !window.__oursOwned?.("index.html")) ensureFrame("index.html");
		show(m[1], m[2] || "", history.state?.query || "");
	} else show("index.html");
})();
</script>
<script>if (window.__OURS_WEB) document.body.appendChild(Object.assign(document.createElement("script"), {src: "/__ours/loadbar.js"}));   // 网页版：下载进度条</script>
</body>
</html>
